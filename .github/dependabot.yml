version: 2
updates:
  - package-ecosystem: "nix"
    directory: &root "/"
    schedule: &schedule
      interval: "daily"
    open-pull-requests-limit: &limit 255
    cooldown: &cooldown
      default-days: 0
    labels: &labels
      - "Update"
    commit-message:
      prefix: "update(nix)"

  - package-ecosystem: "github-actions"
    directory: *root
    schedule: *schedule
    open-pull-requests-limit: *limit
    cooldown: *cooldown
    labels: *labels
    commit-message:
      prefix: "update(actions)"
