name: "Nix Build"
description: "Builds or dry-runs all system configurations using nix-fast-build"
inputs:
  dry_run:
    description: "Whether to run a dry-run check"
    default: "false"
runs:
  using: composite
  steps:
    - name: "nix-fast-build"
      shell: bash
      run: |
        nix run github:Malix-Labs/nix-fast-build/malix -- \
          --flake . \
          --select '${{ github.repository == 'Malix-Labs/dotfiles' && 'flake: (flake.inputs.schemas-evaluator.lib.select { }) flake.outputs' || format('(builtins.getFlake "path:{0}/../../..").inputs.schemas-evaluator.lib.select {{ }}', github.action_path) }}' \
          ${{ github.repository != 'Malix-Labs/dotfiles' && '--impure' || '' }} \
          --skip-cached \
          --no-nom \
          --debug \
          --eval-workers 2 \
          --option show-trace true \
          --option accept-flake-config true \
          ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
