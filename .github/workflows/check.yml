name: "Checks"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: "Format"
    runs-on: &runner ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &nix-setup
        uses: ./.github/actions/nix-setup
      - name: "Check"
        id: "check"
        run: "nix fmt -- --ci"
        working-directory: ./nix
      - name: "Fix"
        if: failure() && steps.check.outcome == "failure"
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "format: ${{ github.head_ref || github.ref_name }}"
          title: "Format ${{ github.head_ref || github.ref_name }}"
          body: "${{ github.server_url }}/${{ github.repository }}/runs/${{ job.check_run_id }}"
          branch: "format/${{ github.head_ref || github.ref_name }}"
          delete-branch: true

  lint:
    name: "Lint"
    runs-on: *runner
    steps:
      - *checkout
      - *nix-setup
      - name: "Statix"
        run: "nix run nixpkgs#statix -- check ./nix"
      - name: "Deadnix"
        if: !cancelled()
        run: "nix run nixpkgs#deadnix -- --fail ./nix"

  flake-check:
    name: "Flake Check"
    runs-on: *runner
    steps:
      - *checkout
      - *nix-setup
      - name: "Flake Checker"
        uses: DeterminateSystems/flake-checker-action@v13
        with:
          flake-lock-path: ./nix/flake.lock
          nixpkgs-keys: nixpkgs-stable,nixpkgs-unstable
          fail-mode: true
      - name: "Flake Check"
        run: "nix flake check ./nix"

  evaluation:
    name: "Evaluation"
    runs-on: *runner
    steps:
      - *checkout
      - *nix-setup
      - uses: ./.github/actions/nix-build
        with:
          dry_run: true
