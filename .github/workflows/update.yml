name: "Update"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      inputs:
        description: "A space-separated list of inputs to update. Leave empty to update all inputs."
        required: false
        type: string
      nix-options:
        description: "Options to pass to nix command"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  main:
    runs-on: ubuntu-latest
    environment: "Malix - GitHub App" # ID:18767037302
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: "write"
          permission-pull-requests: "write"

      - name: Get Dispatch User Info
        if: github.event_name == 'workflow_dispatch'
        id: dispatch-user
        run: gh api "/users/${{ github.actor }}" --jq '"author=" + (.name // .login) + " <" + (.email // (.id|tostring + "+" + .login + "@users.noreply.github.com")) + ">"' >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup

      - uses: DeterminateSystems/update-flake-lock@v28
        env:
          TITLE: "update: ${{ github.event.inputs.inputs || 'all' }}"
        with:
          token: ${{ steps.app-token.outputs.token }}
          git-author-name: &bot_name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git-author-email: &bot_email ${{ format('{0}+{1}[bot]@users.noreply.github.com', vars.USER_ID, steps.app-token.outputs.app-slug) }}
          git-committer-name: *bot_name
          git-committer-email: *bot_email
          inputs: ${{ github.event.inputs.inputs }}
          nix-options: ${{ github.event.inputs.nix-options }}
          branch: "ci/update"
          path-to-flake-dir: "nix"
          pr-labels: "Update"
          pr-title: ${{ env.TITLE }}
          commit-msg: >-
            ${{ env.TITLE }}${{
              github.event_name == 'workflow_dispatch'
              && format('

            Co-authored-by: {0}', steps.dispatch-user.outputs.author)
              || ''
            }}
