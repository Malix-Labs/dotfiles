name: "Build"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  toplevel:
    name: "Build Toplevel"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
        with:
          reclaim: true
      - uses: ./.github/actions/nix-build
